name: Auditoría manual del publicador histórico V152
# Conservado solo para consultar verificaciones, sin modificar ni reescribir index.html.
# El publicador automático original estaba sobrescribiendo versiones V158–V160 con parches V152.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditar-v160:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar módulos vigentes sin escribir archivos
        run: |
          node --check scripts/v127-wallet-switch.js
          node --check scripts/v158-mi-cochera.js
          node --check scripts/v160-invitation-register.js
          node scripts/check-v159-cobra-and-codes.mjs
          node scripts/check-v160-referrals-and-brand.mjs
      - name: Registro de preservación
        run: echo "Publicación conservada; no hay git commit, git push ni aplicación de parches antiguos."
