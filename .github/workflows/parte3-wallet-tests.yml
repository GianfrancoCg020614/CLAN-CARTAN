name: Parte 3 - seguridad de billetera
on:
  pull_request:
    paths:
      - 'scripts/parte3-billetera-*.mjs'
      - 'scripts/catalogo-comisiones*.mjs'
      - 'scripts/clan-roles-comerciales*.mjs'
      - 'scripts/parte4-bono-referidos*.mjs'
      - 'scripts/parte34-adaptadores-legado*.mjs'
      - '.github/workflows/parte3-wallet-tests.yml'
  push:
    branches:
      - 'feature/parte3-billetera-unica-bonos-separados'
    paths:
      - 'scripts/parte3-billetera-*.mjs'
      - 'scripts/parte4-bono-referidos*.mjs'
      - '.github/workflows/parte3-wallet-tests.yml'
jobs:
  wallet-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/parte3-billetera-seguridad.test.mjs scripts/catalogo-comisiones.test.mjs scripts/clan-roles-comerciales.test.mjs scripts/parte4-bono-referidos.test.mjs scripts/parte34-adaptadores-legado.test.mjs
