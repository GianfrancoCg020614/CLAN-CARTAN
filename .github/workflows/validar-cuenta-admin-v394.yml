name: V394 · cuenta, ADMIN y bono compartido
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  password:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cambio de contraseña en Auth real, totalmente aislado
        run: bash scripts/test-v394-auth-local.sh
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          node --check scripts/v394-account-admin.js
          node --check scripts/v394-social-auth.js
          node scripts/test-v304-inline-syntax.mjs
          node scripts/test-v192-persistent-auth-sync.mjs
          pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python scripts/test-v394-account-admin.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuenta-admin-v394
          path: artifacts/v394/
