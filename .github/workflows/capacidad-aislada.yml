name: Capacidad aislada · 10000 propietarios ficticios
on:
  workflow_dispatch:
  push:
    branches: ['test/isolated-capacity']
    paths:
      - '.github/workflows/capacidad-aislada.yml'
      - 'scripts/capacity-*.sh'
      - 'scripts/sql/capacity-http-*.sql'
      - 'tests/k6/isolated-finance.js'
permissions:
  contents: read
concurrency:
  group: capacity-isolated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated:
    # Standard runner in this public repository. No paid/larger runner or cloud resource.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: capacity-fixture-only
          POSTGRES_DB: capacity
        ports: ['5432:5432']
        options: >-
          --cpus=2 --memory=2g --shm-size=256m
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: capacity
      PGPASSWORD: capacity-fixture-only
      ISOLATED: 'YES'
    steps:
      - uses: actions/checkout@v4
      - name: Registrar recursos y descargar herramientas verificadas
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/capacity-bin" artifacts/capacity-isolated
          free -m > artifacts/capacity-isolated/runner.txt
          nproc >> artifacts/capacity-isolated/runner.txt
          psql --version >> artifacts/capacity-isolated/runner.txt
          curl -fsSL --retry 2 https://github.com/grafana/k6/releases/download/v2.4.0/k6-v2.4.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/capacity-bin/k6.tar.gz"
          echo "5a5ecf23529ccf93135bc7e5b0c1cd5126ecf5f2672e22eed1556a0ab74abb87  $RUNNER_TEMP/capacity-bin/k6.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/capacity-bin/k6.tar.gz" -C "$RUNNER_TEMP/capacity-bin"
          echo "K6_BIN=$RUNNER_TEMP/capacity-bin/k6-v2.4.0-linux-amd64/k6" >> "$GITHUB_ENV"
          curl -fsSL --retry 2 https://github.com/PostgREST/postgrest/releases/download/v16.6/postgrest-v16.6-linux-static-x86-64.tar.xz -o "$RUNNER_TEMP/capacity-bin/postgrest.tar.xz"
          echo "335ea29f00145705fb569b1268b9c8e53d062f8f6f9188192e92ea3781d2dca1  $RUNNER_TEMP/capacity-bin/postgrest.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/capacity-bin/postgrest.tar.xz" -C "$RUNNER_TEMP/capacity-bin"
      - name: Crear esquema y 10000 cuentas sintéticas sin datos de producción
        run: bash scripts/capacity-bootstrap-local.sh > artifacts/capacity-isolated/bootstrap.log 2>&1
      - name: Iniciar PostgREST real, solo loopback, con pool limitado
        env:
          PGRST_DB_URI: postgres://capacity_authenticator:capacity-fixture-only@127.0.0.1:5432/capacity
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: capacity-local-jwt-secret-not-valid-in-production-2026
          PGRST_SERVER_HOST: 127.0.0.1
          PGRST_SERVER_PORT: 55432
          PGRST_DB_POOL: 30
          PGRST_DB_POOL_ACQUISITION_TIMEOUT: 3
          PGRST_DB_MAX_ROWS: 100
        run: |
          "$RUNNER_TEMP/capacity-bin/postgrest" > artifacts/capacity-isolated/postgrest.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/capacity-postgrest.pid"
          for attempt in {1..30};do
            if curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:55432/rpc/capacity_fixture_marker;then exit 0;fi
            sleep 1
          done
          exit 1
      - name: Medir carga por etapas con parada ante errores y memoria
        run: bash scripts/capacity-run-stages.sh
      - name: Verificar conciliación tras la carga y registrar diagnóstico
        if: always()
        run: |
          # Every SQL write in the test uses synthetic users only.
          psql -X -v ON_ERROR_STOP=1 -f scripts/sql/capacity-http-verify.sql > artifacts/capacity-isolated/invariants.txt 2>&1
          psql -X -c "select max_conn from (select current_setting('max_connections') max_conn)x; select state,count(*) from pg_stat_activity group by state; select datname,xact_commit,xact_rollback,deadlocks from pg_stat_database where datname='capacity';" > artifacts/capacity-isolated/postgres-stats.txt
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-isolated-${{ github.run_id }}
          path: artifacts/capacity-isolated/
          retention-days: 7
      - name: Cerrar API temporal
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/capacity-postgrest.pid" ]];then kill "$(cat "$RUNNER_TEMP/capacity-postgrest.pid")" || true;fi
          # GitHub removes the service container and runner at job completion.
