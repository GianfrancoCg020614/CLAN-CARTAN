name: Validar finanzas CLAN CARTAN
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  finance-sql:
    name: Finanzas · transacciones, bonos y liquidaciones
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci-fixture-only
    steps:
      - uses: actions/checkout@v4
      - name: Base aislada y funciones de producción auditadas
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/sql/v320-foundation.sql
          for sql in capture_real_wallet_change cc_portal_charge_unified cc_business_access_v316 sb_delivery_is_seller cc_portal_admin_set_super_reseller cc_stream_distributor_eligible cc_portal_purchase_stream_product; do
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f "supabase/recovery/v320_${sql}.sql"
          done
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/sql/v320-audit-trigger.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261105072557_v320_unified_finance_monthly_settlements.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/sql/v320-regression.sql
      - name: Dos peticiones concurrentes no duplican cargo ni bono
        run: bash scripts/test-v320-concurrency.sh

      - name: REC, correo sin acreditación y tarifas autorizadas
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'create database rec321;'
          export PGDATABASE=rec321
          sed '/^create role /d' scripts/sql/v320-foundation.sql | psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1
          for sql in capture_real_wallet_change cc_portal_charge_unified cc_business_access_v316 sb_delivery_is_seller cc_portal_admin_set_super_reseller cc_stream_distributor_eligible cc_portal_purchase_stream_product; do
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f "supabase/recovery/v320_${sql}.sql"
          done
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/sql/v320-audit-trigger.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261105072557_v320_unified_finance_monthly_settlements.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/sql/v321-foundation.sql
          for sql in reserve_verified_payment_receipt cc_submit_manual_recharge cc_admin_decide_manual_recharge_v189 cc_binance_merchant_reserve cc_binance_merchant_credit; do
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f "supabase/recovery/v321_${sql}.sql"
          done
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/sql/v321-receipt-triggers.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/sql/v321-source-acls.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261105124920_v321_recharge_rec_and_reconciliation.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/sql/v321-regression.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/sql/v322-scheduler-fixture.sql
          sed '/^create extension if not exists pg_cron/d; /^create extension if not exists pg_net/d' supabase/migrations/20261105130549_v322_scheduled_deposit_notices.sql | psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/sql/v322-scheduler-regression.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261105131144_v322_private_worker_dispatch.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261105131514_v322_remove_legacy_poll_job.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/sql/v322-private-worker-regression.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261105134223_v322_scheduler_safe_updates.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/sql/v322-safe-update-regression.sql
          bash scripts/test-v321-concurrency.sh
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/recovery/v325_cc_finance_pay_membership.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/recovery/v325_cc_business_access_v316.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/sql/v325-activation-fixture.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261106023906_v325_activation_without_implicit_renewal.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/sql/v325-activation-regression.sql
          bash scripts/test-v325-concurrency.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Avisos de correo ficticios, límites y autorización ADMIN
        run: |
          node scripts/test-v321-payment-notices.mjs
          node scripts/test-v322-scheduler.mjs
          node scripts/test-v322-worker.mjs
          node scripts/test-v325-activation-intent.mjs
