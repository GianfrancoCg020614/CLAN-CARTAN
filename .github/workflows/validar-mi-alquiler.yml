name: Validar MI ALQUILER

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v161-1-mi-alquiler.js'
      - 'styles/v161-1-mi-alquiler.css'
      - 'scripts/v161-2-mi-alquiler.js'
      - 'scripts/v161-3-mi-alquiler.js'
      - 'scripts/v161-4-mi-alquiler.js'
      - 'scripts/check-v2264-mi-alquiler.mjs'
      - '.github/workflows/validar-mi-alquiler.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v161-1-mi-alquiler.js'
      - 'styles/v161-1-mi-alquiler.css'
      - 'scripts/v161-2-mi-alquiler.js'
      - 'scripts/v161-3-mi-alquiler.js'
      - 'scripts/v161-4-mi-alquiler.js'
      - 'scripts/check-v2264-mi-alquiler.mjs'
      - '.github/workflows/validar-mi-alquiler.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-mi-alquiler:
    name: MI ALQUILER — sintaxis, acceso y contratos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar regresiones sin modificar datos
        run: node scripts/check-v2264-mi-alquiler.mjs
