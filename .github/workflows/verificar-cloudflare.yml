name: Verificar despliegue Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: read

concurrency:
  group: verificar-cloudflare-pages-main
  cancel-in-progress: true

jobs:
  comprobar-publicacion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener versión esperada desde GitHub
        uses: actions/checkout@v4

      - name: Comprobar DNS y versión publicada
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sed -n 's/.*<meta name="cc-deploy-version" content="\([^"]*\)".*/\1/p' index.html | head -n1)"
          if [[ -z "$expected" ]]; then
            echo "::error::index.html no contiene cc-deploy-version"
            exit 1
          fi
          host='www.clancartan.com'
          main='https://www.clancartan.com/'
          backup='https://clan-cartan.pages.dev/'
          echo "Versión esperada: $expected"
          echo "Verificando DNS de $host..."
          if ! getent ahosts "$host" >/dev/null; then
            echo "::error::DNS: $host no resuelve. Configura el dominio personalizado en Cloudflare Pages y confirma su CNAME (www -> clan-cartan.pages.dev)."
            echo "### Error de DNS en el dominio principal" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub no pudo resolver **$host**; el código no demuestra por sí solo la conexión del dominio." >> "$GITHUB_STEP_SUMMARY"
            echo "En **Cloudflare → Workers & Pages → clan-cartan → Custom domains**, asocia **www.clancartan.com**." >> "$GITHUB_STEP_SUMMARY"
            echo "Revisa después el registro **CNAME www → clan-cartan.pages.dev** en la zona DNS, sin reemplazar registros MX/TXT." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "DNS OK. Comprobando publicación en HTTPS..."
            for attempt in $(seq 1 4); do
              echo "Intento $attempt de 4"
              if curl --fail --silent --show-error --location --connect-timeout 8 --max-time 20 \
                 --header 'Cache-Control: no-cache' \
                 "${main}?clan_check=${GITHUB_RUN_ID}-${attempt}" -o cloudflare-response.html; then
                if grep -Fq "content=\"$expected\"" cloudflare-response.html; then
                  assets_ok=true
                  for asset in scripts/v113-wallet.js styles/v113-wallet.css scripts/v116-account.js styles/v116-account.css styles/v117-public-catalog.css styles/v118-logout.css scripts/v119-clients.js styles/v119-clients.css scripts/v122-recharges.js styles/v122-recharges.css; do
                    response_asset="artifact-$(basename "$asset")"
                    case "$asset" in
                      scripts/v116-account.js) asset_marker='CLAN CARTAN V127' ;;
                      styles/v116-account.css) asset_marker='CLAN CARTAN V116' ;;
                      *v119*) asset_marker='CLAN CARTAN V119' ;;
                      *v118*) asset_marker='CLAN CARTAN V118' ;;
                      *v117*) asset_marker='CLAN CARTAN V117' ;;
                      scripts/v122-recharges.js) asset_marker='CLAN CARTAN V131.2' ;;
                      styles/v122-recharges.css) asset_marker='V131.2' ;;
                      *) asset_marker='CLAN CARTAN V115' ;;
                    esac
                    if curl --fail --silent --show-error --location --connect-timeout 8 --max-time 20 \
                       "${main}${asset}?clan_check=${GITHUB_RUN_ID}-${attempt}" -o "$response_asset" \
                       && grep -Fq "$asset_marker" "$response_asset"; then
                      echo "✓ Recurso vigente: $asset"
                    else
                      assets_ok=false
                      echo "::warning::El recurso $asset falta o es de una versión anterior"
                    fi
                  done
                  if [[ "$assets_ok" == true ]]; then
                    echo "✓ DNS, HTTPS, versión y recursos JavaScript/CSS $expected correctos"
                    echo "### Sitio público y recursos verificados" >> "$GITHUB_STEP_SUMMARY"
                    echo "Cloudflare publica **$expected**, con JS/CSS, en [www.clancartan.com]($main)." >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                fi
                echo "HTTPS responde, pero todavía no muestra $expected."
              fi
              if [[ "$attempt" != '4' ]]; then sleep 15; fi
            done
            echo "::error::El dominio resuelve, pero no fue posible verificar la versión $expected."
            echo "### Despliegue no confirmado" >> "$GITHUB_STEP_SUMMARY"
            echo "El dominio resuelve pero no presenta la versión **$expected**: revisa **Deployments** en Cloudflare Pages." >> "$GITHUB_STEP_SUMMARY"
          fi
          if curl --fail --silent --show-error --location --max-time 15 \
             "${backup}?clan_check=${GITHUB_RUN_ID}-backup" -o cloudflare-backup.html; then
            if grep -Fq "content=\"$expected\"" cloudflare-backup.html; then
              echo "::warning::La versión $expected aparece en Pages, pero no se verificó en el dominio oficial."
              echo "El respaldo [pages.dev]($backup) sí publica **$expected**." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::La versión esperada tampoco está publicada en pages.dev."
              echo "El respaldo [pages.dev]($backup) aún no publica **$expected**: revisa Git integration / Deployments." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::No fue posible consultar el respaldo de Pages."
            echo "Tampoco fue posible consultar el respaldo [pages.dev]($backup)." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
