name: Verificar despliegue Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: read

jobs:
  comprobar-publicacion:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obtener versión esperada desde GitHub
        uses: actions/checkout@v4

      - name: Comparar V104 y versión servida por Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sed -n 's/.*<meta name="cc-deploy-version" content="\([^"]*\)".*/\1/p' index.html | head -n1)"
          if [[ -z "$expected" ]]; then
            echo "::error::La versión de GitHub no tiene identificador cc-deploy-version."
            exit 1
          fi
          echo "Versión esperada: $expected"
          url='https://clan-cartan.pages.dev/'
          for attempt in $(seq 1 12); do
            echo "Intento $attempt: verificando la publicación..."
            if curl --fail --silent --show-error --location --max-time 25 \
               --header 'Cache-Control: no-cache' \
               "${url}?clan_check=${GITHUB_RUN_ID}-${attempt}" -o cloudflare-response.html; then
              if grep -Fq "content=\"$expected\"" cloudflare-response.html; then
                echo "✓ Cloudflare publica la versión $expected"
                echo "### Cloudflare Pages: versión confirmada" >> "$GITHUB_STEP_SUMMARY"
                echo "La versión **$expected** se encontró en [el sitio público]($url)." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "La página respondió, pero aún no contiene la versión esperada."
            else
              echo "No se pudo consultar Cloudflare en este intento."
            fi
            sleep 20
          done
          echo "::error::No se pudo confirmar la versión $expected en Cloudflare Pages."
          echo "### Cloudflare Pages: publicación sin confirmar" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub espera **$expected**, pero no pudo verificar esa versión en [el sitio]($url)." >> "$GITHUB_STEP_SUMMARY"
          exit 1
