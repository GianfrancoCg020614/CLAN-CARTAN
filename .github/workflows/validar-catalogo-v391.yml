name: Catálogo V391 · precios por rol y USD referencial
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          node --check scripts/v391-usd-reference.js
          node --check scripts/v169-catalogo-unico.js
          node --check scripts/v166-portal-roles.js
          node scripts/test-v304-inline-syntax.mjs
          pip install playwright==1.62.0
          python -m http.server 8000 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" > /tmp/v391-http.log 2>&1 &
          python scripts/test-v391-catalog.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogo-v391-browser
          path: artifacts/v391/
