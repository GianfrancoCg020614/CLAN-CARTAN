name: Validar portal CLAN CARTAN

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-html-y-reglas:
    name: Scripts y reglas comerciales
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis y reglas de seguridad
        run: node scripts/check-v130.mjs
      - name: Validar tarjetas COBRA YA V138 y confirmación de pagos
        run: node scripts/check-v138-cobra-ui.mjs
      - name: Verificar ampliaciones y mensajes WhatsApp V140
        run: node scripts/check-v140-cobra-whatsapp.mjs
      - name: Revisar bonos recurrentes S/5 y ledger real V142
        run: node scripts/check-v142-financial.mjs
      - name: Revisar movimientos reales de billeteras
        run: node scripts/check-v132-movements.mjs
      - name: Revisar recargas manuales y acceso ADMIN
        run: node scripts/check-v136-manual.mjs
      - name: Validar nueva plataforma MI COCHERA V158
        run: |
          node --check scripts/v158-mi-cochera.js
          node scripts/check-v158-mi-cochera.mjs
      - name: Verificar transferencias reales entre tres billeteras sin bonos
        run: |
          node --check scripts/v127-wallet-switch.js
          node scripts/check-v158-three-wallet-transfers.mjs
      - name: Verificar identidad COBRA YA y códigos de referido COCHERA V159
        run: node scripts/check-v159-cobra-and-codes.mjs
      - name: Verificar nuevo logo STREAM BULLS, enlaces y referidos V160
        run: |
          node scripts/check-v160-referrals-and-brand.mjs
          node --check scripts/v160-invitation-register.js
      - name: Validar banderas y consentimiento publicitario voluntario V161
        run: |
          node --check scripts/v161-global-currency-flags.js
          node --check scripts/v161-marketing-account.js
          node scripts/check-v161-currencies-marketing.mjs
      - name: Parte 2 — Código único CLAN y compatibilidad de referidos
        run: |
          node --check scripts/v172-clan-referrals.js
          node --check scripts/v160-invitation-register.js
          node scripts/check-v172-clan.mjs
      - name: Parte 1 — Verificar integración incremental en web oficial
        run: |
          node --check scripts/parte1-registro.js
          node scripts/check-parte1-produccion.mjs
      - name: Comprobar acceso resiliente V161.1
        run: node scripts/check-v161-login-resilience.mjs
      - name: Verificar acceso compartido V161 Parte 1
        run: node scripts/check-v161-part1-auth.mjs
      - name: Rescate V163.5 sobre main sin cambios financieros
        run: |
          node --check scripts/v1635-rescate-ui.js
          node --check scripts/v161-1-mi-alquiler.js
          node --check scripts/v161-2-mi-alquiler.js
          node --check scripts/v161-3-mi-alquiler.js
          node --check scripts/v161-4-mi-alquiler.js
          node scripts/check-v1635-rescate-main.mjs
      - name: Comprobar tarjetas reales en Chrome sin iniciar sesión
        run: |
          set -e
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/clan-local.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          sleep 2
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME" ]; then echo "Falta navegador Chrome/Chromium en el runner"; exit 1; fi
          timeout 40s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8765/ > /tmp/clan-dom.html 2>/tmp/clan-chrome.log
          grep -q 'id="ma1611card"' /tmp/clan-dom.html
          grep -q 'id="cc164-theme-toggle"' /tmp/clan-dom.html
          grep -q 'id="cc161-marketing"' /tmp/clan-dom.html
          grep -q 'scripts/v172-clan-referrals.js?v=172' /tmp/clan-dom.html
          grep -q 'id="cc166-panel-script"' /tmp/clan-dom.html
          grep -q 'id="cc166-panel-style"' /tmp/clan-dom.html
          grep -q 'id="cc169-public-catalog-script"' /tmp/clan-dom.html
          grep -q 'id="cc169-public-catalog-style"' /tmp/clan-dom.html
          grep -q 'id="cc170-stream-flyers-script"' /tmp/clan-dom.html
          grep -q 'id="cc170-stream-flyers-style"' /tmp/clan-dom.html
          grep -q 'id="cc171-admin-simple-css"' /tmp/clan-dom.html
      - name: Panel único de tres roles y membresías · V166
        run: |
          node --check scripts/v151-portal-polish.js
          node --check scripts/v166-portal-roles.js
          node --check scripts/v169-catalogo-unico.js
          node --check scripts/v170-flyers-stream.js
          node scripts/test-v166-three-roles-browser.mjs
          node scripts/test-v167-checkout-browser.mjs
          node scripts/test-v167-financial-integrity.mjs
          node scripts/test-v169-catalog-browser.mjs
          node scripts/test-v169-profile-browser.mjs
          node --check scripts/v170-flyers-stream.js
          node scripts/test-v170-flyers-browser.mjs
          node scripts/test-v171-admin-browser.mjs
          node scripts/test-v175-admin-tabs-browser.mjs
          node scripts/test-v177-wallet-roles-browser.mjs
          node scripts/test-v181-admin-grants-browser.mjs
          node scripts/test-v183-qr-whatsapp-browser.mjs
          node scripts/test-v184-recharge-account-identity.mjs
          node scripts/test-v189-admin-manual-recharge.mjs
          node scripts/test-v185-single-wallet.mjs
          node scripts/test-v182-recharges-regression.mjs
          node scripts/test-v177-role-contract.mjs
          node scripts/test-v172-prices-browser.mjs
          node scripts/test-v172-publish-browser.mjs
          node scripts/test-v173-home-bridge.mjs
          node scripts/test-v173-session-browser.mjs
          node scripts/test-v173-catalog-fallback-browser.mjs
          node -e "const fs=require('fs');if(!fs.readFileSync('scripts/v151-portal-polish.js','utf8').includes('v166-portal-roles.js?v=189'))process.exit(1)"
      - name: Verificar firmas y rechazo de eventos Binance (sin pagos)
        run: node --test scripts/check-binance-webhook.mjs scripts/check-binance-merchant.mjs scripts/check-v133-taypi.mjs
      - name: Probar API de invitaciones sin modificar datos
        run: node scripts/check-v112-live.mjs
