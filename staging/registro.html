<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CLAN CARTAN — Registro STAGING</title><style>body{font:16px system-ui;background:#091426;color:#eff7ff;margin:0;padding:30px}main{max-width:540px;margin:auto;background:#15253a;border:1px solid #38516f;border-radius:14px;padding:26px}label{display:block;margin:18px 0 7px}input:not([type=checkbox]){width:100%;box-sizing:border-box;padding:13px;border-radius:7px;border:1px solid #8493a3}button{margin-top:18px;padding:13px 18px;background:#16ac7b;color:#051d18;border:0;border-radius:7px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}small{color:#c2d2e6}#estado{white-space:pre-wrap}</style></head><body><main><h1>CLAN CARTAN — STAGING</h1><p>Registro de prueba exclusivamente conectado a la base STAGING. No acredita dinero y no crea usuarios en producción.</p><form id="f"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required><label for="password">Contraseña (mínimo 12 caracteres)</label><input id="password" type="password" minlength="12" autocomplete="new-password" required><label><input id="terms" type="checkbox" required> He leído y acepto los Términos y la Política de privacidad de CLAN CARTAN.</label><label><input id="privacy" type="checkbox" required> Autorizo el tratamiento de mis datos personales para crear y gestionar mi cuenta.</label><p><small>Este formulario utiliza las versiones vigentes del sistema de pruebas. Las comunicaciones publicitarias no son requisito para registrar una cuenta.</small></p><button id="send" type="submit">Crear usuario STAGING</button></form><p id="estado" role="status" aria-live="polite"></p></main><script>
const URL='https://szcplebbqhtcgxhvmxdv.supabase.co';
const KEY='sb_publishable_ZkjYbLS7ecPJiFnFihmAaQ_eGIDLHHq';
const form=document.getElementById('f'),status=document.getElementById('estado'),button=document.getElementById('send');
form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;if(!document.getElementById('terms').checked||!document.getElementById('privacy').checked)return;button.disabled=true;status.textContent='Creando usuario exclusivamente en STAGING…';try{const email=document.getElementById('email').value.trim().toLowerCase();const password=document.getElementById('password').value;const response=await fetch(URL+'/auth/v1/signup',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email,password,data:{terms_version:'V161-20261021',privacy_version:'V161-20261021',data_processing_version:'V164-20261023',legal_accepted:true,data_processing_accepted:true}})});const result=await response.json().catch(()=>({}));if(!response.ok)throw Error(result.msg||result.message||result.error_description||'No fue posible registrar la cuenta.');document.getElementById('password').value='';status.textContent='Registro recibido en STAGING. '+(result.session||result.access_token?'Cuenta creada correctamente.':'Revisa tu correo por si requiere confirmación.');}catch(err){status.textContent='No se pudo crear la cuenta: '+err.message;}finally{button.disabled=false;}});
</script></body></html>
